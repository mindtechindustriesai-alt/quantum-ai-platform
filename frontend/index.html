<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KD Quantum — Login</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        /* ============================================================
           YOUR EXISTING CSS — UNCHANGED
           ============================================================ */
        :root {
            --primary: #00C4B4;
            --primary-dark: #009688;
            --secondary: #0052CC;
            --quantum: #8A2BE2;
            --quantum-glow: rgba(138, 43, 226, 0.4);
            --gold: #FFD166;
            --success: #00E6B8;
            --danger: #EF476F;
            --warning: #FF8C42;
            --bg: #0B1120;
            --card: rgba(15, 25, 45, 0.55);
            --border: rgba(0, 196, 180, 0.25);
            --muted: #8EA3BF;
            --text: #FFFFFF;
            --font-exo: 'Exo 2', sans-serif;
            --font-mono: 'Space Mono', monospace;
            --glass-blur: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-exo);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* ===== PARTICLES BACKGROUND ===== */
        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(0, 196, 180, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(138, 43, 226, 0.06) 0%, transparent 50%);
            z-index: 0;
            animation: bgPulse 8s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .login-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .login-card {
            background: var(--card);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 48px 36px 36px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(0, 196, 180, 0.05) inset;
            text-align: center;
            transition: all 0.4s ease;
        }

        .login-card:hover {
            border-color: rgba(0, 196, 180, 0.35);
            transform: translateY(-2px);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 196, 180, 0.08) inset;
        }

        .logo-icon {
            font-size: 52px;
            color: var(--primary);
            filter: drop-shadow(0 0 30px rgba(0, 196, 180, 0.3));
            display: block;
            margin-bottom: 6px;
        }

        .login-card h1 {
            font-size: 30px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--quantum));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        .login-card .subtitle {
            font-size: 11px;
            color: var(--muted);
            font-family: var(--font-mono);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .login-card .patent {
            font-size: 10px;
            color: rgba(138, 43, 226, 0.6);
            font-family: var(--font-mono);
            margin-top: 2px;
        }

        .laser-container {
            width: 100%;
            max-width: 300px;
            height: 3px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 4px;
            margin: 16px auto 20px;
            overflow: hidden;
            position: relative;
        }

        .laser-line {
            width: 30%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--quantum), var(--primary));
            border-radius: 4px;
            animation: laserSweep 3s ease-in-out infinite alternate;
            box-shadow: 0 0 20px var(--primary), 0 0 40px var(--quantum);
        }

        @keyframes laserSweep {
            0% { transform: translateX(-10%); opacity: 0.6; }
            50% { opacity: 1; box-shadow: 0 0 30px var(--primary), 0 0 60px var(--quantum); }
            100% { transform: translateX(90%); opacity: 0.6; }
        }

        .quantum-badge-login {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(138, 43, 226, 0.10);
            border: 1px solid rgba(138, 43, 226, 0.20);
            border-radius: 60px;
            padding: 6px 18px;
            font-size: 10px;
            font-family: var(--font-mono);
            color: var(--quantum);
            margin-bottom: 24px;
            box-shadow: 0 0 20px var(--quantum-glow);
            letter-spacing: 0.3px;
        }

        .quantum-badge-login i {
            font-size: 12px;
        }

        .login-form {
            text-align: left;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-family: var(--font-exo);
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.12);
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 196, 180, 0.06), 0 0 0 3px rgba(0, 196, 180, 0.03);
            background: rgba(0, 0, 0, 0.45);
        }

        .form-group input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 1000px rgba(11, 17, 32, 0.95) inset !important;
            -webkit-text-fill-color: #ffffff !important;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 60px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            font-family: var(--font-exo);
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 4px;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.6s ease;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:hover {
            transform: scale(1.01);
            filter: brightness(1.05);
            box-shadow: 0 8px 30px rgba(0, 196, 180, 0.25);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            filter: none;
        }

        .message {
            margin-top: 14px;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            display: none;
            text-align: center;
            font-family: var(--font-exo);
        }

        .message.error {
            display: block;
            background: rgba(239, 71, 111, 0.10);
            border: 1px solid rgba(239, 71, 111, 0.12);
            color: var(--danger);
        }

        .message.success {
            display: block;
            background: rgba(0, 230, 184, 0.06);
            border: 1px solid rgba(0, 230, 184, 0.08);
            color: var(--success);
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .login-footer {
            margin-top: 24px;
            font-size: 10px;
            color: var(--muted);
            font-family: var(--font-mono);
            letter-spacing: 0.5px;
            opacity: 0.6;
        }

        .login-footer .chsh {
            display: inline-block;
            background: rgba(0, 196, 180, 0.04);
            border: 1px solid rgba(0, 196, 180, 0.04);
            border-radius: 100px;
            padding: 2px 14px;
            font-size: 9px;
            color: rgba(0, 196, 180, 0.4);
            margin-bottom: 6px;
            font-family: var(--font-mono);
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 20px 28px;
            }
            .login-card h1 {
                font-size: 24px;
            }
            .logo-icon {
                font-size: 40px;
            }
            .form-group input {
                padding: 11px 14px;
                font-size: 14px;
            }
            .login-btn {
                padding: 12px;
                font-size: 14px;
            }
        }

        @media (max-width: 380px) {
            .login-card {
                padding: 24px 16px 20px;
                border-radius: 20px;
            }
            .quantum-badge-login {
                font-size: 8px;
                padding: 4px 12px;
            }
        }
    </style>
</head>
<body>

    <!-- PARTICLES -->
    <div id="particles-js"></div>

    <!-- LOGIN CONTAINER -->
    <div class="login-container">

        <div class="login-card">

            <!-- LOGO -->
            <span class="logo-icon">⚛️</span>
            <h1>KD QUANTUM</h1>
            <div class="subtitle">Trading Platform</div>
            <div class="patent">IBM-Verified · SA 2026/05142</div>

            <!-- LASER LINE -->
            <div class="laser-container">
                <div class="laser-line"></div>
            </div>

            <!-- QUANTUM BADGE -->
            <div class="quantum-badge-login">
                <i class="fas fa-shield-alt"></i>
                CHSH S=2.76 · 98.4% · 38% Above Classical
            </div>

            <!-- LOGIN FORM -->
            <form class="login-form" id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label for="username"><i class="fas fa-user" style="margin-right:6px;color:var(--muted);"></i>Username</label>
                    <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    required
                    autofocus
                    />
                </div>

                <div class="form-group">
                    <label for="password"><i class="fas fa-lock" style="margin-right:6px;color:var(--muted);"></i>Password</label>
                    <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                    />
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <span id="btnText"><i class="fas fa-sign-in-alt" style="margin-right:8px;"></i>Sign In</span>
                </button>

                <div class="message" id="message"></div>
            </form>

            <!-- FOOTER -->
            <div class="login-footer">
                <div class="chsh">⚛️ CHSH S=2.76 · Quantum Verified</div>
                &copy; 2026 KD Quantum · All rights reserved.
            </div>

        </div>
    </div>

    <!-- PARTICLES.JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js">
    </script>

    <script>
        // ============================================================
        // CONFIGURATION — CORRECT BACKEND URL
        // ============================================================
        const BACKEND_URL = 'https://quantum-ai-platform-backend.onrender.com';

        // ============================================================
        // PARTICLES
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof particlesJS !== 'undefined') {
                particlesJS('particles-js', {
                    particles: {
                        number: { value: 55, density: { enable: true, value_area: 1000 } },
                        color: { value: ['#00C4B4', '#0052CC', '#8A2BE2', '#FFD166'] },
                        shape: { type: 'circle' },
                        opacity: { value: 0.2, random: true },
                        size: { value: 2.5, random: true },
                        line_linked: { enable: true, distance: 150, color: '#00C4B4', opacity: 0.06,
                            width: 0.8 },
                        move: { enable: true, speed: 0.7, direction: 'none', random: true }
                    },
                    interactivity: {
                        events: { onhover: { enable: true, mode: 'repulse' } }
                    }
                });
            }
        });

        // ============================================================
        // LOGIN LOGIC — FIXED WITH CORRECT BACKEND_URL
        // ============================================================
        (function() {
            'use strict';

            const form = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const messageEl = document.getElementById('message');

            function showMessage(text, type) {
                messageEl.textContent = text;
                messageEl.className = 'message ' + type;
            }

            function clearMessage() {
                messageEl.className = 'message';
                messageEl.textContent = '';
            }

            function setLoading(isLoading) {
                loginBtn.disabled = isLoading;
                btnText.innerHTML = isLoading ?
                    '<span class="spinner"></span> Logging in...' :
                    '<i class="fas fa-sign-in-alt" style="margin-right:8px;"></i>Sign In';
            }

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                clearMessage();

                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();

                if (!username || !password) {
                    showMessage('Please enter both username and password.', 'error');
                    return;
                }

                setLoading(true);

                try {
                    // === CORRECT BACKEND URL ===
                    const response = await fetch(`${BACKEND_URL}/login`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({ username, password })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        const errorMsg = data.detail || data.message || 'Login failed. Please try again.';
                        throw new Error(errorMsg);
                    }

                    if (data.status === 'success' && data.token) {
                        localStorage.setItem('quantum_token', data.token);
                        localStorage.setItem('quantum_username', data.username);

                        showMessage('✅ Login successful! Redirecting to dashboard...', 'success');

                        setTimeout(function() {
                            window.location.href = '/dashboard.html';
                        }, 700);
                    } else {
                        throw new Error('Invalid server response: missing token.');
                    }

                } catch (error) {
                    if (error.message === 'Failed to fetch') {
                        showMessage('❌ Cannot reach backend. Please check if the server is running.', 'error');
                    } else {
                        showMessage('❌ ' + error.message, 'error');
                    }
                    setLoading(false);
                }
            });

            usernameInput.addEventListener('input', clearMessage);
            passwordInput.addEventListener('input', clearMessage);

            console.log('🔐 KD Quantum Login ready');
            console.log(`   Backend URL: ${BACKEND_URL}`);
            console.log('   Test credentials: admin / quantum2026');
        })();
    </script>

</body>
</html>
