<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KD Quantum Trading — Login</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
                   RESET & BASE
                   ============================================================ */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0d1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            margin: 0;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(0, 200, 255, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(100, 0, 255, 0.06) 0%, transparent 60%);
        }

        /* ============================================================
                   LOGIN CARD
                   ============================================================ */
        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(14, 18, 34, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 200, 255, 0.12);
            border-radius: 24px;
            padding: 2.5rem 2rem 2rem;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(0, 200, 255, 0.05) inset;
            transition: border-color 0.3s ease;
        }

        .login-card:hover {
            border-color: rgba(0, 200, 255, 0.20);
        }

        /* ============================================================
                   QUANTUM BADGE
                   ============================================================ */
        .quantum-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: rgba(0, 200, 255, 0.06);
            border: 1px solid rgba(0, 200, 255, 0.10);
            border-radius: 100px;
            padding: 0.4rem 1rem 0.4rem 0.6rem;
            margin: 0 auto 1.5rem;
            width: fit-content;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            color: #7ad0ff;
            text-transform: uppercase;
        }

        .quantum-badge .icon {
            font-size: 1rem;
            line-height: 1;
        }

        /* ============================================================
                   LOGO / TITLE
                   ============================================================ */
        .logo {
            text-align: center;
            margin-bottom: 0.25rem;
        }

        .logo .main {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #94d0ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }

        .logo .sub {
            font-size: 0.75rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-top: 0.1rem;
        }

        .logo .patent {
            font-size: 0.6rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.20);
            letter-spacing: 0.05em;
            margin-top: 0.25rem;
        }

        /* ============================================================
                   FORM
                   ============================================================ */
        .login-form {
            margin-top: 1.75rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 0.4rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            transition: border-color 0.25s ease, background 0.25s ease;
            outline: none;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.20);
            font-weight: 400;
        }

        .form-group input:focus {
            border-color: rgba(0, 200, 255, 0.5);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 3px rgba(0, 200, 255, 0.06);
        }

        .form-group input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 1000px rgba(14, 18, 34, 0.95) inset !important;
            -webkit-text-fill-color: #ffffff !important;
        }

        /* ============================================================
                   BUTTON
                   ============================================================ */
        .login-btn {
            width: 100%;
            padding: 0.9rem;
            margin-top: 0.5rem;
            background: linear-gradient(135deg, #0088ff, #7000ff);
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.25s ease;
            box-shadow: 0 4px 20px rgba(0, 136, 255, 0.25);
            letter-spacing: 0.01em;
        }

        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 30px rgba(0, 136, 255, 0.35);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ============================================================
                   ERROR / STATUS MESSAGES
                   ============================================================ */
        .message {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: center;
            display: none;
        }

        .message.error {
            display: block;
            background: rgba(255, 50, 50, 0.10);
            border: 1px solid rgba(255, 50, 50, 0.15);
            color: #ff6b6b;
        }

        .message.success {
            display: block;
            background: rgba(0, 200, 80, 0.08);
            border: 1px solid rgba(0, 200, 80, 0.12);
            color: #5cffa0;
        }

        /* ============================================================
                   LOADING SPINNER (inline inside button)
                   ============================================================ */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ============================================================
                   FOOTER
                   ============================================================ */
        .footer {
            text-align: center;
            margin-top: 1.75rem;
            font-size: 0.65rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 0.05em;
        }

        .footer .chsh {
            display: inline-block;
            background: rgba(0, 200, 255, 0.05);
            padding: 0.15rem 0.6rem;
            border-radius: 100px;
            border: 1px solid rgba(0, 200, 255, 0.05);
            margin-top: 0.3rem;
            font-weight: 500;
            color: rgba(122, 208, 255, 0.5);
        }

        /* ============================================================
                   RESPONSIVE
                   ============================================================ */
        @media (max-width: 480px) {
            .login-card {
                padding: 1.75rem 1.25rem 1.5rem;
            }

            .logo .main {
                font-size: 1.5rem;
            }

            .form-group input {
                font-size: 0.9rem;
                padding: 0.7rem 0.9rem;
            }
        }
    </style>
</head>
<body>

    <div class="login-card">

        <!-- QUANTUM BADGE -->
        <div class="quantum-badge">
            <span class="icon">⚛️</span>
            CHSH S=2.76 · 98.4% · SA 2026/05142
        </div>

        <!-- LOGO -->
        <div class="logo">
            <div class="main">KD QUANTUM</div>
            <div class="sub">Trading Platform</div>
            <div class="patent">IBM-Verified · Patent Pending</div>
        </div>

        <!-- LOGIN FORM -->
        <form class="login-form" id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="username">Username</label>
                <input
                type="text"
                id="username"
                placeholder="Enter your username"
                required
                autofocus
                />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
                />
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <span id="btnText">Sign In</span>
            </button>

            <!-- Message area -->
            <div class="message" id="message"></div>
        </form>

        <!-- FOOTER -->
        <div class="footer">
            <div class="chsh">⚛️ CHSH S=2.76 · Quantum Verified</div>
            &copy; 2026 KD Quantum · All rights reserved.
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // DOM REFS
            // ============================================================
            const form = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const messageEl = document.getElementById('message');

            // ============================================================
            // HELPERS
            // ============================================================

            /** Show a message (error or success) */
            function showMessage(text, type) {
                messageEl.textContent = text;
                messageEl.className = 'message ' + type;
                // Auto-hide after 5s for success, keep errors visible
                if (type === 'success') {
                    setTimeout(() => {
                        messageEl.className = 'message';
                    }, 5000);
                }
            }

            /** Clear the message */
            function clearMessage() {
                messageEl.className = 'message';
                messageEl.textContent = '';
            }

            /** Set loading state on button */
            function setLoading(isLoading) {
                if (isLoading) {
                    loginBtn.disabled = true;
                    btnText.innerHTML = '<span class="spinner"></span> Logging in...';
                } else {
                    loginBtn.disabled = false;
                    btnText.textContent = 'Sign In';
                }
            }

            /** Get the API base URL — falls back to current origin */
            function getApiBase() {
                // If you're serving the frontend from a different origin than the backend,
                // set this to your backend URL (e.g., https://your-backend.onrender.com)
                // For same-origin deployment, just use ''
                return ''; // or 'https://your-backend.onrender.com'
            }

            // ============================================================
            // LOGIN HANDLER
            // ============================================================

            async function handleLogin(event) {
                event.preventDefault();
                clearMessage();

                // 1. Get credentials
                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();

                if (!username || !password) {
                    showMessage('Please enter both username and password.', 'error');
                    return;
                }

                // 2. Disable button, show loading
                setLoading(true);

                try {
                    // 3. Build request
                    const baseUrl = getApiBase();
                    const url = baseUrl + '/login';

                    const response = await fetch(url, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    });

                    // 4. Parse response
                    const data = await response.json();

                    if (!response.ok) {
                        // Handle HTTP errors (401, 400, 500, etc.)
                        const errorMsg = data.detail || data.message || 'Login failed. Please try again.';
                        throw new Error(errorMsg);
                    }

                    // 5. Login success — we expect a token
                    if (data.status === 'success' && data.token) {
                        // Store the token (localStorage persists across sessions)
                        localStorage.setItem('quantum_token', data.token);
                        localStorage.setItem('quantum_username', data.username);

                        // Show success message briefly
                        showMessage('✅ Login successful! Redirecting...', 'success');

                        // Redirect to the dashboard (same domain)
                        // You can change this to '/dashboard' or './dashboard.html'
                        setTimeout(() => {
                            window.location.href = '/dashboard.html';
                        }, 800);

                    } else {
                        // Unexpected success response without token
                        throw new Error('Invalid server response: missing token.');
                    }

                } catch (error) {
                    // Show error message
                    showMessage('❌ ' + error.message, 'error');
                    // Re-enable the button
                    setLoading(false);
                }
            }

            // ============================================================
            // CHECK FOR EXISTING SESSION (optional)
            // ============================================================

            function checkExistingSession() {
                const token = localStorage.getItem('quantum_token');
                if (token) {
                    // Optionally, you can redirect to dashboard immediately
                    // if you want to skip the login page for returning users.
                    // For security, you might want to verify the token first.
                    // For now, we'll just keep the user on the login page.
                    // Uncomment the next lines to auto-redirect:
                    // window.location.href = '/dashboard.html';
                }
            }

            // ============================================================
            // EVENT LISTENERS
            // ============================================================

            form.addEventListener('submit', handleLogin);

            // Clear error when user starts typing
            usernameInput.addEventListener('input', clearMessage);
            passwordInput.addEventListener('input', clearMessage);

            // ============================================================
            // INIT
            // ============================================================

            // Check if already logged in (optional)
            checkExistingSession();

            // Focus the username field on load
            usernameInput.focus();

            console.log('🔐 KD Quantum Login ready — CHSH S=2.76');

        })();
    </script>

</body>
</html>
